[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-mcp"
version = "0.5.0"
description = "Local Survivalcraft MCP stdio server"
requires-python = ">=3.10"
dependencies = ["sc-bridge>=0.5.0,<0.6.0"]

[project.scripts]
sc-mcp = "sc_mcp.__main__:main"
scapi-mcp = "sc_mcp.cli:main"
